name: Claude Code Review

# Staging POC only. Manual dispatch reviews one approved test PR.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        type: string
        required: true
        default: '529'

permissions: {}

concurrency:
  group: sentinel-review-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: true

env:
  REVIEW_SYSTEM_SHA: 'cc349ac9e03736939e80ce81feae2e506ab064f2'
  SENTINEL_REVIEW_TIMEOUT_MINUTES: '15'
  SENTINEL_REVIEW_MAX_FILES: '200'
  SENTINEL_REVIEW_MAX_SOURCE_BYTES: '4000000'
  SENTINEL_REVIEW_MAX_READ_BYTES: '200000'

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: read
      statuses: write
    outputs:
      timeout_minutes: ${{ steps.prepare.outputs.timeout_minutes }}
    steps:
      - name: Require a pinned canonical reviewer and private checkout access
        env:
          READ_TOKEN_PRESENT: ${{ secrets.SENTINEL_REVIEW_SYSTEM_READ_TOKEN != '' }}
        run: |
          node -e 'if (!/^[0-9a-f]{40}$/.test(process.env.REVIEW_SYSTEM_SHA || "") || process.env.READ_TOKEN_PRESENT !== "true") { throw new Error("The SENTINEL_REVIEW_SYSTEM_READ_TOKEN secret needs read access to the review repository."); }'

      - name: Checkout trusted Sentinel base and Git history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned canonical reviewer
        uses: actions/checkout@v6
        with:
          repository: devrev/sentinel-review-system
          ref: ${{ env.REVIEW_SYSTEM_SHA }}
          token: ${{ secrets.SENTINEL_REVIEW_SYSTEM_READ_TOKEN }}
          path: review-system
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install only trusted reviewer dependencies
        working-directory: review-system
        run: npm ci --ignore-scripts

      - name: Mark the exact PR head review pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types review-system/src/cli.ts action-host start-status

      - name: Checkout existing operational state branch
        uses: actions/checkout@v6
        with:
          ref: sentinel-review-state
          path: review-state
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare canonical review and reserve prior-finding state
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types review-system/src/cli.ts action-host reserve \
            --source-checkout "$GITHUB_WORKSPACE" \
            --state-checkout "$GITHUB_WORKSPACE/review-state" \
            --out "$RUNNER_TEMP/prepared"

      - name: Preserve this run's trusted inputs
        uses: actions/upload-artifact@v4
        with:
          name: canonical-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared
          if-no-files-found: error

  investigate:
    if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success' }}
    needs: prepare
    runs-on: ubuntu-latest
    # The fallback is only for a skipped job after failed preparation, never a run limit.
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.timeout_minutes || '1') }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: devrev/sentinel-review-system
          ref: ${{ env.REVIEW_SYSTEM_SHA }}
          token: ${{ secrets.SENTINEL_REVIEW_SYSTEM_READ_TOKEN }}
          path: review-system
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          ref: sentinel-review-state
          path: review-state
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install only trusted reviewer dependencies
        working-directory: review-system
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: canonical-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared

      - name: Recheck identity and state before model credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types review-system/src/cli.ts action-host check \
            --source-checkout "$GITHUB_WORKSPACE" \
            --state-checkout "$GITHUB_WORKSPACE/review-state" \
            --prepared "$RUNNER_TEMP/prepared"

      - name: Prepare immutable source views and canonical action inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types review-system/src/cli.ts action-host materialize \
            --source-checkout "$GITHUB_WORKSPACE" \
            --prepared "$RUNNER_TEMP/prepared" \
            --out "$GITHUB_WORKSPACE/review-source"

      - name: Configure AWS credentials for this invocation only
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.CLAUDE_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Execute the canonical Sentinel procedure
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc
        with:
          use_bedrock: true
          github_token: ${{ github.token }}
          track_progress: false
          use_sticky_comment: false
          display_report: false
          show_full_output: false
          prompt: ${{ steps.inputs.outputs.prompt }}
          claude_args: ${{ steps.inputs.outputs.claude_args }}
          settings: ${{ steps.inputs.outputs.settings }}

      - name: Capture only this action invocation's outputs
        if: ${{ always() }}
        env:
          ACTION_OUTCOME: ${{ steps.claude.outcome }}
          ACTION_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          ACTION_SESSION_ID: ${{ steps.claude.outputs.session_id }}
          ACTION_STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          ACTION_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          node --experimental-strip-types review-system/src/cli.ts action-host capture \
            --out "$RUNNER_TEMP/action-result"

      - name: Preserve raw execution evidence for trusted validation
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/action-result
          if-no-files-found: error

  claude-auto-review:
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [prepare, investigate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      statuses: write
    steps:
      - name: Require the canonical reviewer pin
        run: |
          node -e 'if (!/^[0-9a-f]{40}$/.test(process.env.REVIEW_SYSTEM_SHA || "")) { throw new Error("Missing canonical reviewer commit; review cannot pass."); }'

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: devrev/sentinel-review-system
          ref: ${{ env.REVIEW_SYSTEM_SHA }}
          token: ${{ secrets.SENTINEL_REVIEW_SYSTEM_READ_TOKEN }}
          path: review-system
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          ref: sentinel-review-state
          path: review-state
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Install only trusted reviewer dependencies
        working-directory: review-system
        run: npm ci --ignore-scripts

      - name: Load only this run's prepared inputs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: canonical-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared

      - name: Load only this run's execution evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: canonical-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/action-result

      - name: Validate, persist, publish, and enforce the canonical decision
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types review-system/src/cli.ts action-host finalize \
            --source-checkout "$GITHUB_WORKSPACE" \
            --state-checkout "$GITHUB_WORKSPACE/review-state" \
            --prepared "$RUNNER_TEMP/prepared" \
            --result "$RUNNER_TEMP/action-result" \
            --out "$RUNNER_TEMP/validated"

      - name: Mark the exact PR head review failed when validation did not complete
        if: ${{ always() && steps.finalize.outputs.canonical_decision == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types review-system/src/cli.ts action-host fail-status

      - name: Preserve validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validated
          if-no-files-found: ignore
